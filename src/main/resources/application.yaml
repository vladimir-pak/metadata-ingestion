# application.yml
server:
  port: 9900
  tomcat:
    max-connections: 100 # Максимальное количество соединений
    accept-count: 100 # Максимальное количество потоков
    threads:
      max: 50 # Размер очереди запросов

spring:
  application:
    name: metadata-ingestion
    version: 0.0.1-SNAPSHOT
    dpt: 912044
    dntdom: GPB
    user: test_user
    ip: test_ip
    host: test_dns
    port: test_port

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meta_base}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:kampus}
    driverClassName: org.postgresql.Driver
    # driverClassName: org.apache.ignite.IgniteJdbcThinDriver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    schemas: metadata_ingestion
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/meta_base
    user: postgres
    password: kampus

ignite:
  client:
    addresses:
      - ${IGNITE_ADDRESS_1:ignite01:10800}
      - ${IGNITE_ADDRESS_2:ignite02:10800}

    username: ${IGNITE_USERNAME}
    password: ${IGNITE_PASSWORD}

    partition-awareness-enabled: true

    ssl:
      enabled: true

      trust-store-path: ${IGNITE_TRUSTSTORE:/opt/app/certs/ignite-truststore.jks}
      trust-store-password: ${IGNITE_TRUSTSTORE_PASSWORD}
      trust-store-type: JKS

      # Указываем, если server использует client-auth=true
      key-store-path: ${IGNITE_KEYSTORE:/opt/app/certs/metadata-ingestion.jks}
      key-store-password: ${IGNITE_KEYSTORE_PASSWORD}
      key-store-type: JKS

      key-algorithm: SunX509
      trust-all: false
    
ord:
  delete:
    threshold: 70
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meta_base}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:kampus}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool
  api:
    baseUrl: http://localhost:8585/api/v1
    endpoints:
      database: /databases
      schema: /databaseSchemas
      table: /tables
    concurrency: 10 # Количество параллельно выполняемых api в ОРД

keycloak:
  server-url: https://auth.example.com/realms/myrealm/protocol/openid-connect/token
  client-id: my-client
  client-secret: my-secret # Опционально
  username: service-user
  password: service-pass

jwt:
  secret: s356tgsf2u4tyuyg
  expirationHours: 24000

logs-database:
  enabled: true
  task-create-partition: 0 0 0 * * ?
  url: jdbc:postgresql://localhost:5432/db_log
  username: postgres
  password: kampus
  driverClassName: org.postgresql.Driver
  table: "audit.jdata_orda_sync_log"

clean-database-logs:
  # cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 1 * * ?
  # delete logs from db that older than X years
  clean-period: 3

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus

  endpoint:
    health:
      show-details: always

logging:
  cef:
    path: logs/cef
    retention-days: 30
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.gpb.metadata.ingestion: DEBUG
  file:
    name: logs/metadata-ingestion.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

metadata:
  cache:
    # Thin Client scan page for normal delta comparison and v2 -> v3 migration.
    scan-page-size: 4096

    # putAll/removeAll chunk size. Keeps TLS payloads bounded.
    commit-batch-size: 2000

    # One backup is appropriate for a 2+ node persistent Ignite cluster.
    backups: 1

    # Full metadata loaded per cold-reconciliation batch.
    reconciliation-batch-size: 5000

    # ONE-TIME rollout switch. Keep true while upgrading v2 -> v3,
    # then set false after all active services have a READY v3 manifest.
    migrate-legacy-v2: false

    # Keep v2 during rollout. Enable only after v3 is proven stable.
    destroy-legacy-after-migration: false

  tables:
    sources:
      postgres:
        database: metadata_replication.database_metadata_postgres
        schema: metadata_replication.schema_metadata_postgres
        table: metadata_replication.table_metadata_postgres

      mssql:
        database: metadata_replication.database_metadata_mssql
        schema: metadata_replication.schema_metadata_mssql
        table: metadata_replication.table_metadata_mssql

      oracle:
        database: metadata_replication.database_metadata_oracle
        schema: metadata_replication.schema_metadata_oracle
        table: metadata_replication.table_metadata_oracle

      sapiq:
        database: metadata_replication.database_metadata_sapiq
        schema: metadata_replication.schema_metadata_sapiq
        table: metadata_replication.table_metadata_sapiq